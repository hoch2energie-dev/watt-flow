<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D-Planung Vorschau</title>
<style>
/* Farben und Schrift wie in app/globals.css. Die Schrift setzt das Bauskript als Daten ein. */
/*SCHRIFT*/
:root {
  --bg: #e9ecea; --elevated: #f4f6f5; --surface: #ffffff; --ink: #16201c; --muted: #5d6863; --line: #dce0dd;
  --brand: #1e5c42; --brand-strong: #164633; --brand-soft: #e2eee7; --accent: #c65b2e; --accent-soft: #f7e6dc; --danger: #9d2c2c;
  --font-sans: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-display: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); }
</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
</body>
</html>
